name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add Android GPS permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<application'
          perms='''<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          '''
          if 'ACCESS_FINE_LOCATION' not in s:
              s=s.replace(marker,perms+marker)
          p.write_text(s)
          PY
      - name: Verify native plugins and permissions
        run: |
          grep -R "CapacitorPluginMlKitTextRecognition" android || exit 1
          grep -R "Geolocation" android || exit 1
          grep "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml || exit 1
          grep "ACCESS_COARSE_LOCATION" android/app/src/main/AndroidManifest.xml || exit 1
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Foaie-parcurs-APK-v1.2.2
          path: android/app/build/outputs/apk/debug/app-debug.apk
