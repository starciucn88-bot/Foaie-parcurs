<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f8"><title>Foaie de parcurs</title><link rel="manifest" href="manifest.json"><script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.2/dist/jspdf.umd.min.js"></script><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:620px;margin:auto;padding:18px 18px 90px}.head{margin:8px 0 18px}.head h1{margin:0;font-size:27px}.head p{margin:6px 0;color:#667}.grid{display:grid;gap:13px}.btn{border:0;border-radius:18px;padding:22px 18px;text-align:left;background:#fff;box-shadow:0 3px 14px #0001;font-size:19px;font-weight:750}.btn small{display:block;font-size:13px;font-weight:500;color:#667;margin-top:5px}.nav,.tools{display:flex;gap:8px;margin-top:16px}.nav button,.tools button{flex:1;padding:12px 6px;border:0;border-radius:13px;background:#e7ebef;font-weight:650}.card{background:#fff;border-radius:16px;padding:14px;margin-top:16px;box-shadow:0 3px 14px #0001}.hidden{display:none}.log{font-size:14px;border-top:1px solid #eee;padding:12px 0;position:relative}.loc{font-weight:700}.muted{color:#667;font-size:12px}.pill{display:inline-block;background:#eef3f7;border-radius:999px;padding:3px 8px}.del{position:absolute;right:0;top:10px;border:0;background:#f4f4f4;border-radius:9px;padding:5px 8px}.camera{display:none}.version{font-size:11px;color:#99a;margin-top:16px;text-align:center}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}.sheet{background:white;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.sheet h2{margin-top:0}.sheet label{display:block;font-size:12px;color:#667;margin:10px 0 3px}.sheet input,.sheet select,.sheet textarea{width:100%;padding:11px;border:1px solid #ccd3da;border-radius:10px;font-size:16px}.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{width:100%;border:0;border-radius:12px;padding:14px;background:#17202a;color:white;font-weight:700;margin-top:14px}.secondary{width:100%;border:0;border-radius:12px;padding:12px;margin-top:8px}.progress{padding:12px;background:#eef3f7;border-radius:10px;margin:8px 0;font-size:13px}.thumb{max-width:100%;max-height:180px;border-radius:10px}.photoLink{border:0;background:#eef3f7;border-radius:8px;padding:5px 8px;margin-top:6px}</style></head><body><div class="wrap"><div class="head"><h1>Foaie de parcurs</h1><p id="active">Nicio deplasare activă</p></div><div class="grid">
<button class="btn" onclick="departure()">🚗 Înregistrează plecare<small>Ora + localitatea; km din ultima sosire</small></button>
<button class="btn" onclick="arrival()">🏁 Înregistrează sosire<small>Ora + localitatea + fotografie odometru</small></button>
<button class="btn" onclick="captureDoc('fuel')">⛽ Înregistrează alimentare<small>Fotografie bon → citire automată OCR</small></button>
<button class="btn" onclick="captureDoc('expense')">🔧 Înregistrează cheltuială auto<small>Bon/factură → citire automată OCR</small></button></div>
<div class="nav"><button onclick="showHistory()">Istoric</button><button onclick="documents()">Documente PDF</button><button onclick="captureDoc('personal')">Decont personal</button></div><div id="history" class="card hidden"></div><div class="tools"><button onclick="backup()">Backup complet</button><button onclick="document.getElementById('restore').click()">Restaurare</button></div><div class="version">V1.0 funcțională • date și fotografii păstrate local</div></div>
<input id="camera" class="camera" type="file" accept="image/*" capture="environment"><input id="restore" class="camera" type="file" accept="application/json" onchange="restoreData(this.files[0])"><div id="modalHost"></div>
<script>
const K='fp_v10';let db=JSON.parse(localStorage.getItem(K)||'null')||{trips:[],fuel:[],expenses:[],personal:[],lastKm:null,active:null,version:10};
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function stamp(){return new Date().toLocaleString('ro-RO')}function id(){return Date.now()+'_'+Math.random().toString(36).slice(2)}
const PDB='fp_photos';function photoDB(){return new Promise((ok,no)=>{let r=indexedDB.open(PDB,1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function putPhoto(file){let k=id(),d=await photoDB();return new Promise((ok,no)=>{let t=d.transaction('p','readwrite');t.objectStore('p').put(file,k);t.oncomplete=()=>ok(k);t.onerror=()=>no(t.error)})}async function getPhoto(k){if(!k)return null;let d=await photoDB();return new Promise(ok=>{let r=d.transaction('p').objectStore('p').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}
async function locate(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve({name:'Locație indisponibilă'});navigator.geolocation.getCurrentPosition(async p=>{let g={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,name:'Locație detectată'};try{let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${g.lat}&lon=${g.lon}&zoom=10&addressdetails=1`,{headers:{'Accept-Language':'ro'}}),j=await r.json(),a=j.address||{};let city=a.city||a.town||a.village||a.municipality||a.county||'';let county=a.county||'';g.name=[city,county].filter((v,i,x)=>v&&x.indexOf(v)===i).join(', ')||'Locație detectată'}catch(e){}resolve(g)},e=>resolve({name:'Locație indisponibilă',error:e.message}),{enableHighAccuracy:true,timeout:15000,maximumAge:15000})})}
function render(){document.getElementById('active').textContent=db.active?`Deplasare activă din ${db.active.time} • ${db.active.place} • km ${db.active.startKm??'necunoscut'}`:'Nicio deplasare activă'}
async function departure(){if(db.active)return alert('Există deja o deplasare activă.');let g=await locate();db.active={time:stamp(),geo:g,startKm:db.lastKm,place:g.name};save();alert(`Plecarea a fost înregistrată: ${g.name}.`)}
function takePhoto(cb){let c=document.getElementById('camera');c.value='';c.onchange=()=>cb(c.files[0]||null);c.click()}
async function arrival(){if(!db.active)return alert('Nu există o plecare activă.');let g=await locate();takePhoto(async file=>{if(!file)return;let pk=await putPhoto(file);showForm('Sosire',[['km','Kilometraj odometru','number','']],async v=>{let km=Number(v.km);if(!Number.isFinite(km))return alert('Kilometraj invalid.');db.trips.push({...db.active,arrivalTime:stamp(),arrivalGeo:g,arrivalPlace:g.name,endKm:km,distance:db.active.startKm==null?null:km-db.active.startKm,photoKey:pk});db.lastKm=km;db.active=null;save()})})}
function captureDoc(kind){takePhoto(async file=>{if(!file)return;let pk=await putPhoto(file);await ocrAndForm(kind,file,pk)})}
async function ocrAndForm(kind,file,pk){modal(`<h2>Citire document</h2><img class="thumb" src="${URL.createObjectURL(file)}"><div id="ocrp" class="progress">OCR: pregătire…</div><button class="secondary" onclick="closeModal()">Anulează</button>`);let text='';try{if(!window.Tesseract)throw new Error('Modul OCR indisponibil. Verifică internetul.');let r=await Tesseract.recognize(file,'eng',{logger:m=>{let p=document.getElementById('ocrp');if(p)p.textContent=`OCR: ${m.status||''} ${m.progress?Math.round(m.progress*100)+'%':''}`}});text=r.data.text||''}catch(e){alert('OCR nu a putut porni: '+e.message)}closeModal();let x=parseDoc(text,kind),g=await locate();if(kind==='fuel')fuelForm(x,g,pk,text);else expenseForm(kind,x,g,pk,text)}
function money(s){let m=String(s||'').replace(/\s/g,'').match(/\d+[.,]\d{2}/g);return m?m[m.length-1].replace(',','.'):''}function parseDoc(t,kind){let s=t.replace(/\r/g,' '),lines=s.split('\n').map(x=>x.trim()).filter(Boolean);let date=(s.match(/\b([0-3]?\d[.\/-][01]?\d[.\/-](?:20)?\d{2,4})\b/)||[])[1]||'';let fiscal=(s.match(/(?:bon|fiscal|nr\.?)[^\d]{0,12}(\d{3,})/i)||[])[1]||'';let trans=(s.match(/(?:tranzac|transaction|stan|rrn)[^\d]{0,15}(\d{4,})/i)||[])[1]||'';let liters=(s.match(/(\d+[.,]\d{1,3})\s*(?:l|litri)\b/i)||[])[1]?.replace(',','.')||'';let price=(s.match(/(?:pret|price)[^\d]{0,12}(\d+[.,]\d{2,3})/i)||[])[1]?.replace(',','.')||'';let total=(s.match(/(?:total|valoare|de plata)[^\d]{0,20}(\d+[.,]\d{2})/i)||[])[1]?.replace(',','.')||money(s);let invoice=(s.match(/(?:factura|invoice)[^\n\d]{0,12}(?:nr\.?\s*)?([A-Z0-9\-\/]{3,})/i)||[])[1]||'';let cui=(s.match(/(?:CUI|CIF|RO)\s*[:#]?\s*(RO)?\s*(\d{5,10})/i)||[]);return{brand:lines[0]||'',station:'',locality:'',date,fiscal,trans,liters,price,total,supplier:lines[0]||'',invoice,cui:cui[2]||''}}
function fuelForm(x,g,pk,text){showForm('Alimentare – verifică datele',[['brand','Brand','text',x.brand],['station','Stație','text',x.station],['locality','Localitate','text',x.locality||g.name],['date','Data','text',x.date],['fiscal','Nr. bon fiscal','text',x.fiscal],['trans','Nr. tranzacție','text',x.trans],['liters','Litri','number',x.liters],['price','Preț/L','number',x.price],['value','Valoare','number',x.total]],v=>{db.fuel.push({time:stamp(),...v,geo:g,photoKey:pk,ocr:text});save()})}
function expenseForm(kind,x,g,pk,text){showForm(kind==='personal'?'Decont personal – verifică':'Cheltuială auto – verifică',[['supplier','Furnizor','text',x.supplier],['invoice','Nr. bon/factură','text',x.invoice||x.fiscal],['cui','CUI/CIF','text',x.cui],['date','Data','text',x.date],['type','Tip cheltuială','text',''],['value','Valoare','number',x.total],['locality','Localitate','text',g.name]],v=>{db[kind==='personal'?'personal':'expenses'].push({time:stamp(),...v,geo:g,photoKey:pk,ocr:text});save()})}
function modal(html){document.getElementById('modalHost').innerHTML=`<div class="modal"><div class="sheet">${html}</div></div>`}function closeModal(){document.getElementById('modalHost').innerHTML=''}
function showForm(title,fields,onSave){let html=`<h2>${title}</h2><form id="f">`;for(let [n,l,t,v] of fields)html+=`<label>${l}</label><input name="${n}" type="${t}" step="any" value="${esc(v)}">`;html+=`<button class="primary" type="submit">Salvează</button><button class="secondary" type="button" onclick="closeModal()">Anulează</button></form>`;modal(html);document.getElementById('f').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));onSave(v);closeModal()}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
async function viewPhoto(k){let b=await getPhoto(k);if(!b)return alert('Fotografia nu mai este disponibilă.');let u=URL.createObjectURL(b);modal(`<h2>Document</h2><img class="thumb" style="max-height:70vh" src="${u}"><button class="secondary" onclick="closeModal()">Închide</button>`)}function remove(kind,i){if(!confirm('Șterg această înregistrare?'))return;db[kind].splice(i,1);save();showHistory(true)}
function showHistory(force){let h=document.getElementById('history');if(!force)h.classList.toggle('hidden');if(h.classList.contains('hidden'))return;let a=[];db.trips.forEach((x,i)=>a.push(log('Deplasare',`${esc(x.place)} → ${esc(x.arrivalPlace)}<br>${x.startKm??'?'} → ${x.endKm} km ${x.distance!=null?`<span class="pill">${x.distance} km</span>`:''}`,x,i,'trips')));db.fuel.forEach((x,i)=>a.push(log('Alimentare',`${esc(x.brand)} • ${esc(x.locality)}<br>${esc(x.liters)} L • ${esc(x.price)} lei/L • ${esc(x.value)} lei`,x,i,'fuel')));db.expenses.forEach((x,i)=>a.push(log('Cheltuială auto',`${esc(x.supplier)} • ${esc(x.type)} • ${esc(x.value)} lei`,x,i,'expenses')));db.personal.forEach((x,i)=>a.push(log('Decont personal',`${esc(x.supplier)} • ${esc(x.type)} • ${esc(x.value)} lei`,x,i,'personal')));h.innerHTML='<b>Istoric local</b>'+(a.join('')||'<p>Nicio înregistrare.</p>')}function log(t,b,x,i,k){return `<div class="log"><button class="del" onclick="remove('${k}',${i})">Șterge</button><b>${t}</b><br><span class="muted">${esc(x.time)}</span><br>${b}${x.photoKey?`<br><button class="photoLink" onclick="viewPhoto('${x.photoKey}')">Vezi fotografia</button>`:''}</div>`}
function documents(){let m=prompt('Luna pentru PDF (AAAA-LL):',new Date().toISOString().slice(0,7));if(!m)return;if(!window.jspdf)return alert('Modul PDF necesită internet la prima utilizare.');let {jsPDF}=window.jspdf,d=new jsPDF(),y=15;d.setFontSize(16);d.text('FOAIE DE PARCURS / CENTRALIZATOR',14,y);y+=8;d.setFontSize(10);d.text('Luna: '+m,14,y);y+=8;for(let x of db.trips){if(!isoMonth(x.time,m))continue;d.text(`${x.time} | ${x.place} - ${x.arrivalPlace} | ${x.startKm??'?'}-${x.endKm} km | ${x.distance??'?'} km`,14,y);y+=6;if(y>280){d.addPage();y=15}}d.save(`foaie_parcurs_${m}.pdf`)}function isoMonth(ro,m){let q=String(ro).match(/(\d{2})\.(\d{2})\.(\d{4})/);return q?`${q[3]}-${q[2]}`===m:true}
async function backup(){let photos={};for(let arr of [db.trips,db.fuel,db.expenses,db.personal])for(let x of arr)if(x.photoKey){let b=await getPhoto(x.photoKey);if(b)photos[x.photoKey]=await blob64(b)}let out={db,photos};download(JSON.stringify(out),'foaie_parcurs_backup_'+new Date().toISOString().slice(0,10)+'.json','application/json')}function blob64(b){return new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)})}function download(s,n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(file){if(!file)return;let r=new FileReader();r.onload=async()=>{try{let o=JSON.parse(r.result);if(!o.db)throw 0;db=o.db;for(let [k,v] of Object.entries(o.photos||{})){let b=await fetch(v).then(r=>r.blob()),d=await photoDB();await new Promise(ok=>{let t=d.transaction('p','readwrite');t.objectStore('p').put(b,k);t.oncomplete=ok})}save();alert('Backup restaurat.')}catch(e){alert('Backup invalid.')}};r.readAsText(file)}
render();
</script></body></html>
