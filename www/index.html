<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foaie de parcurs</title><style>body{font-family:system-ui;background:#f4f6f8;margin:0;color:#17202a}.w{max-width:620px;margin:auto;padding:18px}.b{width:100%;padding:20px;margin:8px 0;border:0;border-radius:16px;background:white;text-align:left;font-size:18px;font-weight:700}.b small{display:block;color:#667;font-weight:400}.m{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end}.s{background:white;width:100%;padding:18px;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;margin:4px 0 10px;box-sizing:border-box}.p,.q{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px}.p{background:#17202a;color:white}.q{background:#e9edf0}label{font-size:12px;color:#667}.v{text-align:center;color:#889;font-size:11px;margin-top:20px}</style></head><body><div class="w"><h1>Foaie de parcurs</h1><p id="a">Nicio deplasare activă</p><button class="b" onclick="start()">🚗 Înregistrează plecare<small>Preia ultima sosire • localitate și km editabile</small></button><button class="b" onclick="stop()">🏁 Înregistrează sosire<small>Preia ultima sosire • localitate și km editabile</small></button><button class="b" onclick="fuel()">⛽ Alimentare<small>Introducere manuală / lipire • OCR doar odometru</small></button><button class="b" onclick="expense()">🔧 Cheltuială auto<small>Manual • fotografie/PDF opțional</small></button><div class="v">V1.3.1 • plecare preluată din ultima sosire • OCR odometru la sosire/alimentare</div></div><input hidden id="cam" type="file" accept="image/*" capture="environment"><input hidden id="doc" type="file" accept="image/*,application/pdf"><div id="h"></div><script>
const K='fp_v130';let d=JSON.parse(localStorage.getItem(K)||'null')||{trips:[],fuel:[],expenses:[],places:['Râșnov','Brașov','Pașcani'],lastKm:null,active:null};const $=x=>document.getElementById(x);function save(){localStorage.setItem(K,JSON.stringify(d));render()}function render(){$('a').textContent=d.active?'Deplasare activă • '+d.active.place+' • km '+d.active.km:'Nicio deplasare activă'}function ts(){return new Date().toLocaleString('ro-RO')}function dt(){return new Date().toLocaleDateString('ro-RO')}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pick(id,cb){let x=$(id);x.value='';x.onchange=()=>cb(x.files[0]);x.click()}async function du(f){return await new Promise(r=>{let q=new FileReader();q.onload=()=>r(q.result);q.readAsDataURL(f)})}async function ocr(f){let O=window.Capacitor?.Plugins?.CapacitorPluginMlKitTextRecognition;if(!O)throw Error('OCR indisponibil');let b=(await du(f)).replace(/^data:image\/[^;]+;base64,/,'');return (await O.detectText({base64Image:b,rotation:0})).text}function odo(t){let x=[...t.matchAll(/\b\d{4,7}\b/g)].map(v=>+v[0]);let q=d.lastKm==null?x:x.filter(v=>v>=d.lastKm&&v-d.lastKm<3000);return q.length?Math.min(...q):(x.length?Math.max(...x):'')}function close(){h.innerHTML=''}function km(cb){window.kcb=cb;h.innerHTML='<div class="m"><div class="s"><h2>Kilometraj</h2><button class="p" onclick="kphoto()">📷 Fotografiază odometrul</button><button class="q" onclick="kmanual()">⌨️ Introdu manual</button><button class="q" onclick="close()">Anulează</button></div></div>'}function kphoto(){pick('cam',async f=>{try{let v=odo(await ocr(f));one('Verifică kilometrajul','km','Kilometraj',v,x=>window.kcb(x.km))}catch(e){alert(e.message);kmanual()}})}function kmanual(){one('Kilometraj','km','Kilometraj','',x=>window.kcb(x.km))}function opts(v=''){return [...new Set([...d.places,v].filter(Boolean))].map(x=>'<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>').join('')}function loc(){return '<label>Localitate</label><select name="place">'+opts()+'</select><button type="button" class="q" onclick="addloc()">+ Adaugă localitate</button>'}function addloc(){let x=prompt('Localitate nouă');if(!x)return;x=x.trim();if(!d.places.includes(x))d.places.push(x);save();let s=h.querySelector('select');if(s){s.innerHTML=opts(x);s.value=x}}function tripform(title,kmv,cb){h.innerHTML='<div class="m"><div class="s"><h2>'+title+'</h2><form id="f">'+loc()+'<label>Scopul deplasării</label><input name="purpose"><label>Observații</label><textarea name="notes"></textarea><button class="p">Salvează</button></form></div></div>';f.onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(f)),kmv)}}function start(){
 if(d.active)return alert('Există deja o deplasare activă');
 let last=d.trips.length?d.trips[d.trips.length-1]:null;
 let place=last?.arrivalPlace||'';
 let kmv=last?.endKm??d.lastKm??'';
 departureForm({place,km:kmv});
}
function departureForm(v){
 h.innerHTML='<div class="m"><div class="s"><h2>Plecare</h2><form id="f"><label>Data / ora</label><input value="'+esc(ts())+'" disabled><label>Localitate plecare</label><select name="place">'+opts(v.place||'')+'</select><button type="button" class="q" onclick="addloc()">+ Adaugă localitate</button><label>Km plecare</label><input name="km" inputmode="numeric" value="'+esc(v.km??'')+'"><label>Scopul deplasării</label><input name="purpose"><label>Observații</label><textarea name="notes"></textarea><button class="p">Înregistrează plecarea</button><button type="button" class="q" onclick="close()">Anulează</button></form></div></div>';
 f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));let k=+x.km;if(!Number.isFinite(k))return alert('Kilometraj invalid');d.active={time:ts(),place:x.place,km:k,purpose:x.purpose,notes:x.notes};d.lastKm=k;save();close()}
}function stop(){if(!d.active)return alert('Nu există plecare activă');km(k=>tripform('Sosire',k,(x,k)=>{d.trips.push({...d.active,arrivalTime:ts(),arrivalPlace:x.place,endKm:+k,purpose:x.purpose||d.active.purpose,notes:x.notes||d.active.notes});d.lastKm=+k;d.active=null;save();close()}))}
function fuel(){km(k=>fuelform({date:dt(),km:k}))}function fuelform(v){h.innerHTML='<div class="m"><div class="s"><h2>Alimentare</h2><button class="q" type="button" onclick="pastefuel()">📋 Lipește date</button><form id="f"><label>Data</label><input name="date" value="'+esc(v.date||dt())+'">'+loc()+'<label>Nr. bon fiscal</label><input name="bon" value="'+esc(v.bon||'')+'"><label>Litri</label><input name="liters" value="'+esc(v.liters||'')+'"><label>Valoare</label><input name="value" value="'+esc(v.value||'')+'"><label>Kilometraj</label><input name="km" value="'+esc(v.km||'')+'"><button type="button" class="q" onclick="pick(\'cam\',x=>window.bon=x?.name)">📷 Poză bon (opțional)</button><button class="p">Salvează</button></form></div></div>';f.onsubmit=e=>{e.preventDefault();d.fuel.push({...Object.fromEntries(new FormData(f)),time:ts(),fileName:window.bon||''});save();close()}}async function pastefuel(){try{let x=(await navigator.clipboard.readText()).trim().split('|');if(x[0].toUpperCase()==='ALIM')x.shift();if(x.length<5)throw 0;fuelform({date:x[0],place:x[1],bon:x[2],liters:x[3],value:x[4],km:h.querySelector('[name=km]')?.value||''})}catch(e){alert('Format: ALIM|data|localitate|nr.bon|litri|valoare')}}function expense(){h.innerHTML='<div class="m"><div class="s"><h2>Cheltuială auto</h2><form id="f"><label>Data</label><input name="date" value="'+dt()+'"><label>Produs / cheltuială</label><input name="product"><label>Nr. factură / bon</label><input name="number"><label>Valoare</label><input name="value"><button type="button" class="q" onclick="pick(\'doc\',x=>window.edoc=x?.name)">📎 Fotografie / PDF (opțional)</button><button class="p">Salvează</button></form></div></div>';f.onsubmit=e=>{e.preventDefault();d.expenses.push({...Object.fromEntries(new FormData(f)),time:ts(),fileName:window.edoc||''});save();close()}}function one(title,n,l,v,cb){h.innerHTML='<div class="m"><div class="s"><h2>'+title+'</h2><form id="f"><label>'+l+'</label><input name="'+n+'" value="'+esc(v)+'"><button class="p">Continuă</button></form></div></div>';f.onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(f)))}}render();
</script></body></html>
