<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Foaie de parcurs</title>
<style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:620px;margin:auto;padding:18px 18px 90px}.btn{display:block;width:100%;border:0;border-radius:18px;padding:20px 18px;margin:12px 0;text-align:left;background:#fff;box-shadow:0 3px 14px #0001;font-size:18px;font-weight:750}.btn small{display:block;color:#667;font-size:13px;font-weight:500;margin-top:5px}.version{font-size:11px;color:#889;text-align:center;margin-top:20px}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.sheet input{width:100%;padding:11px;margin:3px 0 10px;border:1px solid #ccd3da;border-radius:10px;font-size:16px}.sheet label{font-size:12px;color:#667}.primary,.secondary{width:100%;padding:13px;border:0;border-radius:12px;margin-top:8px}.primary{background:#17202a;color:#fff}.progress{background:#eef3f7;padding:12px;border-radius:10px}.thumb{max-width:100%;max-height:190px;border-radius:10px}</style></head><body>
<div class="wrap"><h1>Foaie de parcurs</h1><p id="active">Nicio deplasare activă</p>
<button class="btn" onclick="departure()">🚗 Înregistrează plecare<small>Ora + localitatea GPS; km din ultima sosire</small></button>
<button class="btn" onclick="arrival()">🏁 Înregistrează sosire<small>Ora + localitatea GPS + OCR odometru</small></button>
<button class="btn" onclick="capture('fuel')">⛽ Înregistrează alimentare<small>Bon → OCR și completare automată</small></button>
<button class="btn" onclick="expenseChoice()">🔧 Înregistrează cheltuială auto<small>Fotografie bon/factură sau PDF</small></button>
<div class="version">V1.2.2 • GPS fix • OCR bonuri îmbunătățit • PDF facturi</div></div>
<input id="cam" hidden type="file" accept="image/*" capture="environment"><input id="doc" hidden type="file" accept="image/*,application/pdf"><div id="host"></div>
<script>
const K='fp_v122'; let db=JSON.parse(localStorage.getItem(K)||'null')||{trips:[],fuel:[],expenses:[],lastKm:null,active:null};
function save(){localStorage.setItem(K,JSON.stringify(db));render()} function stamp(){return new Date().toLocaleString('ro-RO')}
function render(){active.textContent=db.active?`Deplasare activă • ${db.active.place} • km ${db.active.startKm??'necunoscut'}`:'Nicio deplasare activă'}
async function locate(){
 try{
  const G=window.Capacitor?.Plugins?.Geolocation;if(!G)throw Error('Plugin GPS indisponibil');
  const st=await G.checkPermissions(); if(st.location!=='granted'&&st.coarseLocation!=='granted'){const p=await G.requestPermissions();if(p.location!=='granted'&&p.coarseLocation!=='granted')throw Error('Permisiunea de locație nu a fost acordată');}
  const p=await G.getCurrentPosition({enableHighAccuracy:true,timeout:20000,maximumAge:5000});
  let g={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,name:`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`};
  try{let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${g.lat}&lon=${g.lon}&zoom=14&addressdetails=1`,{headers:{'Accept-Language':'ro'}});let j=await r.json(),a=j.address||{};g.name=a.city||a.town||a.village||a.municipality||a.county||g.name}catch(_){}
  return g;
 }catch(e){alert('GPS: '+e.message);return null}
}
async function departure(){if(db.active)return alert('Există deja o deplasare activă.');let g=await locate();if(!g)return;db.active={time:stamp(),place:g.name,geo:g,startKm:db.lastKm};save();alert('Plecarea: '+g.name)}
function pick(id,cb){let x=document.getElementById(id);x.value='';x.onchange=()=>cb(x.files[0]||null);x.click()}
async function dataUrl(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(f)})}
async function ocr(f){if(f.type==='application/pdf')throw Error('PDF-ul necesită text PDF; în V1.2.2 este acceptat ca document, iar OCR direct este pentru imagini.');let O=window.Capacitor?.Plugins?.CapacitorPluginMlKitTextRecognition;if(!O)throw Error('OCR indisponibil');let u=await dataUrl(f),b=String(u).replace(/^data:image\/[^;]+;base64,/,'');let r=await O.detectText({base64Image:b,rotation:0});if(!r.text)throw Error('Nu am detectat text');return r.text}
function odo(t,min){let a=[...t.matchAll(/\b(\d{4,7})\b/g)].map(x=>+x[1]);if(min!=null){let q=a.filter(x=>x>=+min&&x-+min<3000);if(q.length)return Math.min(...q)}return a.length?Math.max(...a):''}
async function arrival(){if(!db.active)return alert('Nu există plecare activă.');let g=await locate();if(!g)return;pick('cam',async f=>{if(!f)return;let t='',v='';try{t=await ocr(f);v=odo(t,db.active.startKm)}catch(e){alert(e.message)}form('Sosire',[['km','Kilometraj',v]],x=>{let km=+x.km;if(!Number.isFinite(km))return alert('Kilometraj invalid');db.trips.push({...db.active,arrivalTime:stamp(),arrivalPlace:g.name,arrivalGeo:g,endKm:km});db.lastKm=km;db.active=null;save()})})}
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
function num(s){return clean(s).replace(/\./g,'').replace(',','.')}
function amountFrom(lines){
 const bad=/\b(AUTH|RRN|AID|BATCH|MID|TID|STAN|CARD|PAN|TERMINAL|CASIER|AMEF)\b/i;
 const strong=[/\bTOTAL(?:\s+LEI|\s+RON)?\b/i,/\bDE\s+PLAT[ĂA]\b/i,/\bSUMA\b/i,/\bCARD\b/i];
 for(const rx of strong){for(const l of lines){if(rx.test(l)&&!(/\bCARD\b/i.test(l)&&bad.test(l.replace(/CARD/i,'')))){let m=[...l.matchAll(/(\d{1,6}[.,]\d{2})\b/g)];if(m.length)return num(m[m.length-1][1])}}}
 let vals=[];for(const l of lines){if(bad.test(l))continue;for(const m of l.matchAll(/(\d{1,6}[.,]\d{2})\b/g))vals.push(+num(m[1]))}return vals.length?String(Math.max(...vals)):''
}
function dateFrom(s){let m=s.match(/\b([0-3]?\d[.\/-][01]?\d[.\/-](?:20)?\d{2,4})\b/);return m?m[1]:''}
function bonFrom(lines){
 const pats=[/\bBON(?:\s+FISCAL)?\s*(?:NR\.?|#)?\s*[:\-]?\s*(\d{3,10})/i,/\bNR\.?\s*BON\s*[:\-]?\s*(\d{3,10})/i];
 for(const p of pats)for(const l of lines){let m=l.match(p);if(m)return m[1]}
 // Common Romanian fiscal footer: number near "BON" or immediately before date/time, but exclude AMEF/AUTH/RRN.
 for(const l of lines){if(/AMEF|AUTH|RRN|AID|BATCH|CUI|CIF/i.test(l))continue;let m=l.match(/\b(\d{5,8})\b/);if(m&&/BON|FISCAL/i.test(l))return m[1]}return ''
}
function productFrom(lines){
 const ignore=/DEDEMAN|SRL|S\.R\.L|CUI|CIF|TOTAL|TVA|CARD|BON|FISCAL|AMEF|AUTH|RRN|AID|BATCH|CASIER|MAGAZIN|ADRESA|TEL|DATA|ORA|LEI|RON/i;
 let c=lines.filter(l=>l.length>5&&!ignore.test(l)&&/[A-Za-zĂÂÎȘȚăâîșț]/.test(l)&&!/^[-\d\s.,xX*%]+$/.test(l));
 return c.slice(0,2).join(' + ')
}
function parse(t,kind){let lines=t.replace(/\r/g,'').split('\n').map(clean).filter(Boolean),s=lines.join('\n');let total=amountFrom(lines),date=dateFrom(s),bon=bonFrom(lines),product=productFrom(lines);
 if(kind==='fuel'){let liters=(s.match(/(\d+[.,]\d{1,3})\s*(?:L|LITRI)\b/i)||[])[1]||'';let price=(s.match(/(?:PRE[TȚ]|PRICE|LEI\/L)[^\d]{0,15}(\d+[.,]\d{2,3})/i)||[])[1]||'';let trans=(s.match(/(?:TRANZAC|STAN|RRN)[^\d]{0,20}(\d{4,})/i)||[])[1]||'';return{brand:lines[0]||'',station:'',locality:'',date,bon,trans,liters:num(liters),price:num(price),value:total}}
 return{product,value:total,number:bon,date}
}
function capture(kind){pick('cam',f=>processDoc(kind,f))}
function expenseChoice(){host.innerHTML='<div class="modal"><div class="sheet"><h2>Cheltuială auto</h2><button class="primary" onclick="closeM();capture(\'expense\')">Fotografiază bon/factură</button><button class="secondary" onclick="closeM();pick(\'doc\',f=>processDoc(\'expense\',f))">Selectează PDF / fișier</button><button class="secondary" onclick="closeM()">Anulează</button></div></div>'}
async function processDoc(kind,f){if(!f)return;if(f.type==='application/pdf'){form('Cheltuială – PDF atașat',[['product','Produs/cheltuială',''],['value','Valoare',''],['number','Nr. factură/bon',''],['date','Data','']],x=>{db.expenses.push({...x,time:stamp(),fileName:f.name});save()});return}
 host.innerHTML='<div class="modal"><div class="sheet"><div class="progress">OCR: citesc și interpretez documentul…</div></div></div>';try{let t=await ocr(f),x=parse(t,kind);closeM();if(kind==='fuel')form('Alimentare – verifică',[['brand','Brand',x.brand],['station','Stație',x.station],['locality','Localitate',x.locality],['date','Data',x.date],['bon','Nr. bon fiscal',x.bon],['trans','Nr. tranzacție',x.trans],['liters','Litri',x.liters],['price','Preț/L',x.price],['value','Valoare',x.value]],v=>{db.fuel.push({...v,time:stamp()});save()});else form('Cheltuială auto – verifică',[['product','Produs/cheltuială',x.product],['value','Valoare',x.value],['number','Nr. factură/bon',x.number],['date','Data',x.date]],v=>{db.expenses.push({...v,time:stamp()});save()})}catch(e){closeM();alert('OCR: '+e.message)}}
function form(title,fields,cb){let h=`<div class="modal"><div class="sheet"><h2>${title}</h2><form id="f">`;for(const [n,l,v] of fields)h+=`<label>${l}</label><input name="${n}" value="${esc(v)}">`;h+='<button class="primary">Salvează</button><button type="button" class="secondary" onclick="closeM()">Anulează</button></form></div></div>';host.innerHTML=h;f.onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(e.target)));closeM()}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function closeM(){host.innerHTML=''}render();
</script></body></html>
