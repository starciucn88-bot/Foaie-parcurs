<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foaie de parcurs</title><style>body{font-family:system-ui;background:#f4f6f8;margin:0;color:#17202a}.w{max-width:620px;margin:auto;padding:18px}.b{width:100%;padding:20px;margin:8px 0;border:0;border-radius:16px;background:white;text-align:left;font-size:18px;font-weight:700}.b small{display:block;color:#667;font-weight:400}.m{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end}.s{background:white;width:100%;padding:18px;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;margin:4px 0 10px;box-sizing:border-box}.p,.q{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px}.p{background:#17202a;color:white}.q{background:#e9edf0}label{font-size:12px;color:#667}.v{text-align:center;color:#889;font-size:11px;margin-top:20px} .sheet{background:white;color:#111;padding:0;min-width:0}.report{border-collapse:collapse;width:100%;table-layout:fixed;font-size:8px;overflow-wrap:anywhere}.report th,.report td{border:1px solid #444;padding:4px}.report th{background:#eee}.sheet h2{text-align:center}.company{font-weight:bold}.sign{margin-top:22px}

</style></head><body><div class="w"><header class="top"><div id="vehiclePlate" class="plate">AUTOVEHICUL</div><p id="a">Nicio deplasare activă</p><div id="vehicleAlerts" class="alerts" hidden></div></header><main class="actions"><button class="b" onclick="start()"><span class="bi">🚗</span><span>Înregistrează plecare</span></button><button class="b" onclick="stop()"><span class="bi">🏁</span><span>Înregistrează sosire</span></button><button class="b" onclick="fuel()"><span class="bi">⛽</span><span>Alimentare</span></button><button class="b" onclick="expense()"><span class="bi">🔧</span><span>Cheltuială auto</span></button><button class="b" onclick="records()"><span class="bi">📋</span><span>Înregistrări</span></button><button class="b" onclick="documents()"><span class="bi">📄</span><span>Generare documente</span></button></main><div class="secondary-actions"><button class="b" onclick="vehicleDetails()"><span class="bi">🚘</span><span>Date vehicul</span></button><button class="b" onclick="backupRestoreMenu()"><span class="bi">💾</span><span>Backup și restaurare</span></button></div><div class="v">v1.3.14 by NS</div></div><input hidden id="cam" type="file" accept="image/*" capture="environment"><input hidden id="doc" type="file" accept="image/*,application/pdf"><input hidden id="restoreFile" type="file" accept=".json,application/json"><div id="h"></div><script>
const K='fp_v130';let d=JSON.parse(localStorage.getItem(K)||'null')||{trips:[],fuel:[],expenses:[],places:['Râșnov','Brașov','Pașcani'],lastKm:null,active:null};
d.purposes=d.purposes||['Deplasare la șantier','Activitate șantier','Activitate birou','Întoarcere'];
d.notesList=d.notesList||[];const $=x=>document.getElementById(x);function save(){localStorage.setItem(K,JSON.stringify(d));render();syncTripNotification()}
function syncTripNotification(){let p=window.Capacitor?.Plugins?.TripNotification;if(p)p.sync({active:!!d.active,place:d.active?.place||"",time:d.active?.time||""}).catch(e=>console.warn("Notificare deplasare:",e))}function render(){
 $('a').textContent=d.active?'Deplasare activă • '+d.active.place+' • km '+d.active.km:'Nicio deplasare activă';
 const v=d.vehicle||{};$('vehiclePlate').textContent=(v.registration||'AUTOVEHICUL').toUpperCase();
 const notices=[];const today=new Date();today.setHours(0,0,0,0);
 for(const [label,key] of [['ITP','itp'],['RCA','rca'],['CASCO','casco'],['Rovinietă','rovinieta']]){
  if(!v[key])continue;const date=new Date(v[key]+'T00:00:00');if(!Number.isFinite(date.getTime()))continue;
  const days=Math.ceil((date-today)/86400000);if(days<=30)notices.push(label+': '+(days<0?'expirat de '+(-days)+' zile':days===0?'expiră astăzi':'expiră în '+days+' zile'));
 }
 if(v.revisionKm!==undefined&&v.revisionKm!==''&&d.lastKm!==null){const left=Number(v.revisionKm)-Number(d.lastKm);if(Number.isFinite(left)&&left<=1000)notices.push('Revizie: '+(left<=0?'termen depășit':'în '+left+' km'));}
 const el=$('vehicleAlerts');el.hidden=!notices.length;el.textContent=notices.length?'⚠️ Atenționări\n'+notices.join('\n'):'';
}function ts(){return new Date().toLocaleString('ro-RO')}function dt(){return new Date().toLocaleDateString('ro-RO')}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pick(id,cb){let x=$(id);x.value='';x.onchange=()=>cb(x.files[0]);x.click()}async function du(f){return await new Promise(r=>{let q=new FileReader();q.onload=()=>r(q.result);q.readAsDataURL(f)})}async function ocr(f){let O=window.Capacitor?.Plugins?.CapacitorPluginMlKitTextRecognition;if(!O)throw Error('OCR indisponibil');let b=(await du(f)).replace(/^data:image\/[^;]+;base64,/,'');return (await O.detectText({base64Image:b,rotation:0})).text}function odo(t){let x=[...t.matchAll(/\b\d{4,7}\b/g)].map(v=>+v[0]);let q=d.lastKm==null?x:x.filter(v=>v>=d.lastKm&&v-d.lastKm<3000);return q.length?Math.min(...q):(x.length?Math.max(...x):'')}function closeModal(){h.innerHTML=''}function odometerNumber(value,minimum,strict=true){
 const raw=String(value??'').trim();
 if(!/^\d+$/.test(raw))throw Error('Kilometrajul trebuie să conțină numai cifre întregi.');
 const n=Number(raw);
 if(!Number.isSafeInteger(n))throw Error('Kilometrajul introdus nu este valid.');
 if(minimum!==null&&minimum!==undefined&&minimum!==''&&(strict?n<=Number(minimum):n<Number(minimum)))
  throw Error('Kilometrajul trebuie să fie '+(strict?'mai mare decât ':'cel puțin egal cu ')+minimum+' km.');
 return n;
}
function checkedOdometer(value,minimum,strict=true){try{return odometerNumber(value,minimum,strict)}catch(e){alert(e.message);return null}}
function kmMinimum(){return d.active?d.active.km:d.lastKm}
function km(cb){window.kcb=cb;h.innerHTML='<div class="m"><div class="s"><h2>Kilometraj</h2><button class="p" onclick="kphoto()">📷 Fotografiază odometrul</button><button class="q" onclick="kmanual()">⌨️ Introdu manual</button><button class="q" onclick="closeModal()">Anulează</button></div></div>'}function kphoto(){pick('cam',async f=>{try{let v=odo(await ocr(f));one('Verifică kilometrajul','km','Kilometraj',v,x=>{let k=checkedOdometer(x.km,kmMinimum());if(k!==null)window.kcb(k)})}catch(e){alert(e.message);kmanual()}})}function kmanual(){one('Kilometraj','km','Kilometraj','',x=>{let k=checkedOdometer(x.km,kmMinimum());if(k!==null)window.kcb(k)})}function opts(v=''){return [...new Set([...d.places,v].filter(Boolean))].map(x=>'<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>').join('')}function loc(v=''){return '<label>Localitate</label><select name="place">'+opts(v)+'</select><button type="button" class="q" onclick="addloc()">+ Adaugă localitate</button>'}function addloc(){let x=prompt('Localitate nouă');if(!x)return;x=x.trim();if(!d.places.includes(x))d.places.push(x);save();let s=h.querySelector('select');if(s){s.innerHTML=opts(x);s.value=x}}function listopts(a,v=''){return [...new Set([...(a||[]),v].filter(Boolean))].map(x=>'<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>').join('')}
function purposeField(v=''){return '<label>Scopul deplasării</label><select name="purpose">'+listopts(d.purposes,v)+'</select><button type="button" class="q" onclick="addPurpose()">+ Adaugă scop nou</button>'}
function notesField(v=''){let empty='<option value="">— Fără observații —</option>';return '<label>Observații</label><select name="notes">'+empty+listopts(d.notesList,v)+'</select><button type="button" class="q" onclick="addNote()">+ Adaugă observație nouă</button>'}
function addPurpose(){let x=prompt('Scop nou:');if(!x)return;x=x.trim();if(!x)return;if(!d.purposes.includes(x))d.purposes.push(x);save();let q=h.querySelector('select[name=purpose]');if(q){q.innerHTML=listopts(d.purposes,x);q.value=x}}
function addNote(){let x=prompt('Observație nouă:');if(!x)return;x=x.trim();if(!x)return;if(!d.notesList.includes(x))d.notesList.push(x);save();let q=h.querySelector('select[name=notes]');if(q){q.innerHTML='<option value="">— Fără observații —</option>'+listopts(d.notesList,x);q.value=x}}
function tripform(title,kmv,cb){h.innerHTML='<div class="m"><div class="s"><h2>'+title+'</h2><form id="f">'+loc(d.active?.place||'')+purposeField(d.active?.purpose||'')+notesField(d.active?.notes||'')+'<button class="p">Salvează</button></form></div></div>';f.onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(f)),kmv)}}function backupRestoreMenu(){h.innerHTML='<div class="m"><div class="s"><h2>Backup și restaurare</h2><button class="p" onclick="closeModal();backup()">💾 Copie de siguranță</button><button class="q" onclick="closeModal();restore()">📥 Restaurare date</button><button class="q" onclick="closeModal()">Închide</button></div></div>'}
function vehicleDetails(){
 const v=d.vehicle||{};
 const fields=[['registration','Număr de înmatriculare','text'],['brand','Marcă / model','text'],['itp','ITP – expiră la','date'],['rca','RCA – expiră la','date'],['casco','CASCO – expiră la','date'],['rovinieta','Rovinietă – expiră la','date'],['revisionKm','Următoarea revizie – km','number']];
 h.innerHTML='<div class="m"><div class="s"><h2>Date vehicul</h2><form id="vehicleForm">'+fields.map(([key,label,type])=>'<label>'+label+'</label><input name="'+key+'" type="'+type+'" '+(type==='number'?'min="0" step="1"':'')+' value="'+esc(v[key]??'')+'">').join('')+'<button class="p" type="submit">Salvează</button><button type="button" class="q" onclick="closeModal()">Anulează</button></form></div></div>';
 $('vehicleForm').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));values.registration=values.registration.trim().toUpperCase();if(values.revisionKm&&!/^\d+$/.test(values.revisionKm)){alert('Kilometrajul reviziei trebuie să fie un număr întreg.');return;}d.vehicle=values;save();closeModal();};
}
function start(){
 if(d.active)return alert('Există deja o deplasare activă');
 let last=d.trips.length?d.trips[d.trips.length-1]:null;
 let place=last?.arrivalPlace||d.active?.place||'';
 let kmv=last?.endKm??d.lastKm??'';
 departureForm({place,km:kmv});
}
function departureForm(v){
 h.innerHTML='<div class="m"><div class="s"><h2>Plecare</h2><form id="f"><label>Data / ora</label><input value="'+esc(ts())+'" disabled><label>Localitate plecare</label><select name="place">'+opts(v.place||'')+'</select><button type="button" class="q" onclick="addloc()">+ Adaugă localitate</button><label>Km plecare</label><input name="km" type="number" min="0" step="1" inputmode="numeric" required value="'+esc(v.km??'')+'">${purposeField()}${notesField()}<button class="p">Înregistrează plecarea</button><button type="button" class="q" onclick="closeModal()">Anulează</button></form></div></div>';
 f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));let k=checkedOdometer(x.km,d.lastKm,false);if(k===null)return;d.active={time:ts(),place:x.place,km:k,purpose:x.purpose,notes:x.notes};d.lastKm=k;save();closeModal()}
}function stop(){if(!d.active)return alert('Nu există plecare activă');km(k=>tripform('Sosire',k,(x,k)=>{k=checkedOdometer(k,d.active.km);if(k===null)return;d.trips.push({...d.active,arrivalTime:ts(),arrivalPlace:x.place,endKm:+k,purpose:x.purpose||d.active.purpose,notes:x.notes||d.active.notes});d.lastKm=+k;d.active=null;save();closeModal()}))}
function fuel(){km(k=>fuelForm({date:dt(),km:k}))}
function paymentField(v=""){return `<label>Achitat cu</label><select name="payment"><option value="card_combustibil" ${!v||v==="card_combustibil"?"selected":""}>Card combustibil / OP</option><option value="card_personal" ${v==="card_personal"?"selected":""}>Card personal</option><option value="cash" ${v==="cash"?"selected":""}>Cash</option></select>`}
function fuelForm(v={}){
 h.innerHTML=`<div class="m"><div class="s"><h2>Alimentare</h2>
 <label>Date bon – lipire rapidă</label>
 <textarea id="fuelPaste" rows="3" placeholder="ALIM|26.09.2026|Roman|002508|45.87|341.26"></textarea>
 <button class="q" type="button" id="fillFuel">Completează din text</button>
 <form id="fuelForm">
 <label>Data</label><input name="date" value="${esc(v.date||dt())}">
 ${loc(v.place||'')}
 <label>Nr. bon fiscal</label><input name="bon" value="${esc(v.bon||'')}">
 <label>Litri</label><input name="liters" inputmode="decimal" value="${esc(v.liters||'')}">
 <label>Valoare</label><input name="value" inputmode="decimal" value="${esc(v.value||'')}">
 <label>Kilometraj</label><input name="km" type="number" min="0" step="1" inputmode="numeric" required value="${esc(v.km??'')}">
 ${paymentField(v.payment)}
 <button type="button" class="q" id="fuelPhoto">📷 Poză bon (opțional)</button>
 <button class="p">Salvează</button>
 <button type="button" class="q" onclick="closeModal()">Anulează</button>
 </form></div></div>`;

 document.getElementById('fillFuel').onclick=()=>{
   const raw=(document.getElementById('fuelPaste').value||'').trim().replace(/\r?\n/g,'');
   let a=raw.split('|').map(x=>x.trim());
   if((a[0]||'').toUpperCase()==='ALIM')a.shift();
   if(a.length!==5){alert('Format: ALIM|data|localitate|nr.bon|litri|valoare');return}
   const [datev,place,bon,liters,value]=a;
   if(place&&!d.places.includes(place))d.places.push(place);
   const km=document.querySelector('#fuelForm [name=km]').value;
   fuelForm({date:datev||dt(),place,bon,liters,value,km});
 };
 document.getElementById('fuelPhoto').onclick=()=>pick('cam',x=>window.bon=x?.name||'');
 document.getElementById('fuelForm').onsubmit=e=>{
   e.preventDefault();
   const x=Object.fromEntries(new FormData(e.target));
   if(!x.date||!x.place||!x.bon||!x.liters||!x.value||!x.km){alert('Completează câmpurile obligatorii.');return}
   d.fuel.push({...x,time:ts(),fileName:window.bon||''});
   save();closeModal();
 };
}
function expense(){h.innerHTML='<div class="m"><div class="s"><h2>Cheltuială auto</h2><form id="f"><label>Data</label><input name="date" value="'+dt()+'"><label>Produs / cheltuială</label><input name="product"><label>Nr. factură / bon</label><input name="number"><label>Valoare</label><input name="value">'+paymentField()+'<button type="button" class="q" onclick="pick(\'doc\',x=>window.edoc=x?.name)">📎 Fotografie / PDF (opțional)</button><button class="p">Salvează</button><button type="button" class="q" onclick="closeModal()">Anulează</button></form></div></div>';f.onsubmit=e=>{e.preventDefault();d.expenses.push({...Object.fromEntries(new FormData(f)),time:ts(),fileName:window.edoc||''});save();closeModal()}}function one(title,n,l,v,cb){h.innerHTML='<div class="m"><div class="s"><h2>'+title+'</h2><form id="f"><label>'+l+'</label><input name="'+n+'" value="'+esc(v)+'"><button class="p">Continuă</button><button type="button" class="q" onclick="closeModal()">Anulează</button></form></div></div>';f.onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(f)))}}function records(){
 let rows='';
 d.trips.map((x,i)=>({...x,_index:i})).sort((a,b)=>dateObj(a.time)-dateObj(b.time)).forEach(x=>{let i=x._index;rows+=`<div class="q"><b>🚗 ${esc(x.place||'—')} → ${esc(x.arrivalPlace||'—')}</b><br>${esc(x.km??'—')} → ${esc(x.endKm??'—')} km<br><br><small>${esc(x.time)} → ${esc(x.arrivalTime)}</small><br><button onclick="editTrip(${i})">Editează</button> <button onclick="delrec('trip',${i})">Șterge</button></div>`});
 d.fuel.forEach((x,i)=>rows+=`<div class="q"><b>⛽ ${esc(x.place||'—')} • ${esc(x.liters||'—')} L</b><br>${esc(x.date||'')} • ${esc(x.value||'—')} lei • bon ${esc(x.bon||'—')}<br><button onclick="editFuel(${i})">Editează</button> <button onclick="delrec('fuel',${i})">Șterge</button></div>`);
 d.expenses.forEach((x,i)=>rows+=`<div class="q"><b>🔧 ${esc(x.product||'Cheltuială')}</b><br>${esc(x.date||'')} • ${esc(x.value||'—')} lei<br><button onclick="editExpense(${i})">Editează</button> <button onclick="delrec('expense',${i})">Șterge</button></div>`);
 h.innerHTML=`<div class="m"><div class="s"><h2>Înregistrări</h2>${rows||'<p>Nu există înregistrări.</p>'}<button class="q" onclick="closeModal()">Închide</button></div></div>`;
}
function delrec(t,i){if(!confirm('Ștergi această înregistrare?'))return;(t==='trip'?d.trips:t==='fuel'?d.fuel:d.expenses).splice(i,1);save();records()}
function editFuel(i){let x=d.fuel[i];fuelForm({...x});let ff=document.getElementById('fuelForm');if(ff)ff.onsubmit=e=>{e.preventDefault();d.fuel[i]={...x,...Object.fromEntries(new FormData(e.target))};save();records()}}
function editExpense(i){let x=d.expenses[i];h.innerHTML=`<div class="m"><div class="s"><h2>Editare cheltuială</h2><form id="ee"><label>Data</label><input name="date" value="${esc(x.date||'')}"><label>Produs</label><input name="product" value="${esc(x.product||'')}"><label>Nr. factură/bon</label><input name="number" value="${esc(x.number||'')}"><label>Valoare</label><input name="value" value="${esc(x.value||'')}">${paymentField(x.payment)}<button class="p">Salvează</button><button type="button" class="q" onclick="records()">Anulează</button></form></div></div>`;ee.onsubmit=e=>{e.preventDefault();d.expenses[i]={...x,...Object.fromEntries(new FormData(e.target))};save();records()}}


function dateObj(s){let iso=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]);let m=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})(?:[,\s]+(\d{1,2}):(\d{2}))?/);return m?new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)):new Date(0)}
function inputDate(s){let x=dateObj(s);if(!x.getTime())x=new Date();return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')+'T'+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')}

function editTrip(i){let x=d.trips[i];h.innerHTML=`<div class="m"><div class="s"><h2>Editare deplasare</h2><form id="editTripForm"><label>Data și ora plecării</label><input type="datetime-local" name="start" required value="${inputDate(x.time)}"><label>Localitate plecare</label><input name="place" required value="${esc(x.place)}"><label>Kilometraj plecare</label><input type="number" name="km" required value="${esc(x.km)}"><label>Data și ora sosirii</label><input type="datetime-local" name="end" required value="${inputDate(x.arrivalTime)}"><label>Localitate sosire</label><input name="arrivalPlace" required value="${esc(x.arrivalPlace)}"><label>Kilometraj sosire</label><input type="number" name="endKm" required value="${esc(x.endKm)}">${purposeField(x.purpose)}${notesField(x.notes)}<button class="p">Salvează</button><button type="button" class="q" onclick="records()">Anulează</button></form></div></div>`;document.getElementById('editTripForm').onsubmit=e=>{e.preventDefault();let a=Object.fromEntries(new FormData(e.target));let begin=checkedOdometer(a.km,null),end=checkedOdometer(a.endKm,begin);

const others=d.trips.map((t,j)=>({...t,j})).filter(t=>t.j!==i).sort((a,b)=>dateObj(a.time)-dateObj(b.time));

async function saveFile(name,bytes,mime){
 const cap=window.Capacitor;const plugins=cap?.Plugins;
 if(cap?.isNativePlatform?.() && plugins?.Filesystem && plugins?.Share){
   try{
     const base64=bytesToBase64(bytes);
     const out=await plugins.Filesystem.writeFile({path:name,data:base64,directory:'CACHE'});
     await plugins.Share.share({title:name,url:out.uri,dialogTitle:'Salvează sau distribuie '+name});
     return;
   }catch(e){alert('Nu s-a putut salva/distribui fișierul: '+e.message);return}
 }
 download(name,new Blob([bytes],{type:mime}),mime);
}

function monthRows(month){
 const trips=d.trips.filter(x=>dateKey(x.time).startsWith(month)).map((x,i)=>({...x,_sort:i})).sort((a,b)=>dateObj(a.time)-dateObj(b.time));
 const rows=[];const n=new Date(+month.slice(0,4),+month.slice(5),0).getDate();
 for(let day=1;day<=n;day++){
  const key=month+'-'+String(day).padStart(2,'0');const todays=trips.filter(x=>dateKey(x.time)===key);
  if(todays.length){todays.forEach(x=>rows.push({date:key,trip:x,stationary:false}));continue}
  const spanning=d.trips.some(x=>dateKey(x.time)<key&&dateKey(x.arrivalTime)>=key);
  const prev=d.trips.filter(x=>dateKey(x.arrivalTime)&&dateKey(x.arrivalTime)<key).sort((a,b)=>dateObj(b.arrivalTime)-dateObj(a.arrivalTime))[0];
  rows.push({date:key,trip:prev||null,stationary:!spanning,spanning});

}
