<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f8"><title>Foaie de parcurs</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:560px;margin:auto;padding:18px 18px 90px}.head{margin:8px 0 18px}.head h1{margin:0;font-size:27px}.head p{margin:6px 0;color:#667}.grid{display:grid;gap:13px}.btn{border:0;border-radius:18px;padding:22px 18px;text-align:left;background:#fff;box-shadow:0 3px 14px #0001;font-size:19px;font-weight:750}.btn small{display:block;font-size:13px;font-weight:500;color:#667;margin-top:5px}.nav{display:flex;gap:8px;margin-top:20px}.nav button{flex:1;padding:12px 6px;border:0;border-radius:13px;background:#e7ebef;font-weight:650}.card{background:#fff;border-radius:16px;padding:14px;margin-top:16px;box-shadow:0 3px 14px #0001}.hidden{display:none}.log{font-size:14px;border-top:1px solid #eee;padding:12px 0;position:relative}.log:first-of-type{margin-top:8px}.loc{font-weight:700}.muted{color:#667;font-size:12px}.pill{display:inline-block;background:#eef3f7;border-radius:999px;padding:3px 8px;margin-top:4px}.del{position:absolute;right:0;top:10px;border:0;background:#f4f4f4;border-radius:9px;padding:5px 8px}.camera{display:none}.notice{background:#fff8df;border-radius:12px;padding:10px 12px;font-size:12px;margin-top:12px}.tools{display:flex;gap:8px;margin-top:12px}.tools button{flex:1;border:0;border-radius:10px;padding:10px}.activeTrip{background:#eaf7ef!important}.version{font-size:11px;color:#99a;margin-top:16px;text-align:center}</style></head><body><div class="wrap"><div class="head"><h1>Foaie de parcurs</h1><p id="active">Nicio deplasare activă</p></div><div class="grid">
<button class="btn" onclick="departure()">🚗 Înregistrează plecare<small>Ora + localitatea; km din ultima sosire</small></button>
<button class="btn" onclick="arrival()">🏁 Înregistrează sosire<small>Ora + localitatea + fotografie odometru</small></button>
<button class="btn" onclick="fuel()">⛽ Înregistrează alimentare<small>Fotografie bon + date alimentare</small></button>
<button class="btn" onclick="expense()">🔧 Înregistrează cheltuială auto<small>Service, rovinietă, parcare etc.</small></button></div>
<div class="nav"><button onclick="showHistory()">Istoric</button><button onclick="alert('PDF-urile după modelul tău intră în etapa următoare.')">Documente</button><button onclick="personal()">Decont personal</button></div>
<div id="history" class="card hidden"></div><div class="notice">V0.2: localitatea este determinată automat din GPS când există internet. Fotografiile sunt deschise prin cameră; citirea automată a textului din ele vine în etapa OCR.</div><div class="tools"><button onclick="backup()">Backup date</button><button onclick="document.getElementById('restore').click()">Restaurare</button></div><div class="version">V0.2</div></div>
<input id="camera" class="camera" type="file" accept="image/*" capture="environment"><input id="restore" class="camera" type="file" accept="application/json" onchange="restoreData(this.files[0])">
<script>
const K='fp_v02';let db=JSON.parse(localStorage.getItem(K)||'null')||migrate();
function migrate(){let old=JSON.parse(localStorage.getItem('fp_v01')||'null');return old?{...old,version:2}:{trips:[],fuel:[],expenses:[],personal:[],lastKm:null,active:null,version:2}}
function save(){localStorage.setItem(K,JSON.stringify(db));render()} function stamp(){return new Date().toLocaleString('ro-RO')}
async function locate(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve({name:'Locație indisponibilă'});navigator.geolocation.getCurrentPosition(async p=>{let g={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,name:'Locație detectată'};try{let u=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${g.lat}&lon=${g.lon}&zoom=10&addressdetails=1`;let r=await fetch(u,{headers:{'Accept-Language':'ro'}});let j=await r.json();let a=j.address||{};g.name=a.city||a.town||a.village||a.municipality||a.county||'Locație detectată'}catch(e){}resolve(g)},()=>resolve({name:'Locație indisponibilă'}),{enableHighAccuracy:true,timeout:12000,maximumAge:30000})})}
function render(){document.getElementById('active').textContent=db.active?`Deplasare activă din ${db.active.time} • ${db.active.place||'locație'} • km ${db.active.startKm??'necunoscut'}`:'Nicio deplasare activă'}
async function departure(){if(db.active)return alert('Există deja o deplasare activă.');let g=await locate();db.active={time:stamp(),geo:g,startKm:db.lastKm,place:g.name};save();alert(`Plecarea a fost înregistrată din ${g.name}.`)}
function takePhoto(cb){let c=document.getElementById('camera');c.value='';c.onchange=()=>cb(c.files[0]||null);c.click()}
async function arrival(){if(!db.active)return alert('Nu există o plecare activă.');let g=await locate();takePhoto(file=>{let km=prompt('Introdu kilometrajul citit de pe odometru:');if(km===null)return;km=Number(String(km).replace(/[^0-9.,]/g,'').replace(',','.'));if(!Number.isFinite(km))return alert('Kilometraj invalid.');if(db.active.startKm!=null&&km<db.active.startKm&&!confirm('Kilometrajul este mai mic decât la plecare. Salvez totuși?'))return;db.trips.push({...db.active,arrivalTime:stamp(),arrivalGeo:g,arrivalPlace:g.name,endKm:km,distance:db.active.startKm==null?null:km-db.active.startKm,photoName:file?.name||''});db.lastKm=km;db.active=null;save();alert(`Sosirea a fost înregistrată în ${g.name}.`)})}
function fuel(){takePhoto(async file=>{let liters=prompt('Litri:');if(liters===null)return;let price=prompt('Preț/L:');let value=prompt('Valoare:');let g=await locate();db.fuel.push({time:stamp(),geo:g,place:g.name,liters,price,value,photoName:file?.name||''});save()})}
function expense(){takePhoto(file=>{let type=prompt('Tip cheltuială (ex. rovinietă, service):');if(type===null)return;let value=prompt('Valoare:');db.expenses.push({time:stamp(),type,value,photoName:file?.name||''});save()})}
function personal(){takePhoto(file=>{let desc=prompt('Explicație document:');if(desc===null)return;let value=prompt('Sumă:');db.personal.push({time:stamp(),desc,value,photoName:file?.name||''});save()})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function remove(kind,i){if(!confirm('Șterg această înregistrare?'))return;db[kind].splice(i,1);save();showHistory(true)}
function showHistory(force){let h=document.getElementById('history');if(!force)h.classList.toggle('hidden');if(h.classList.contains('hidden'))return;let a=[];db.trips.forEach((x,i)=>a.push(`<div class="log"><button class="del" onclick="remove('trips',${i})">Șterge</button><b>Deplasare</b><br><span class="loc">${esc(x.place||x.geo?.name||'Locație')}</span> → <span class="loc">${esc(x.arrivalPlace||x.arrivalGeo?.name||'Locație')}</span><br><span class="muted">${esc(x.time)} → ${esc(x.arrivalTime)}</span><br>${x.startKm??'?'} → ${x.endKm} km ${x.distance!=null?`<span class="pill">${x.distance} km</span>`:''}</div>`));db.fuel.forEach((x,i)=>a.push(`<div class="log"><button class="del" onclick="remove('fuel',${i})">Șterge</button><b>Alimentare</b> • <span class="loc">${esc(x.place||'')}</span><br><span class="muted">${esc(x.time)}</span><br>${esc(x.liters||'?')} L • ${esc(x.price||'?')} lei/L • ${esc(x.value||'?')} lei</div>`));db.expenses.forEach((x,i)=>a.push(`<div class="log"><button class="del" onclick="remove('expenses',${i})">Șterge</button><b>Cheltuială auto</b><br><span class="muted">${esc(x.time)}</span><br>${esc(x.type||'')} • ${esc(x.value||'?')} lei</div>`));h.innerHTML='<b>Istoric local</b>'+(a.join('')||'<p>Nicio înregistrare.</p>')}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='foaie_parcurs_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.trips||!x.fuel)throw 0;if(confirm('Înlocuiesc datele locale cu backup-ul selectat?')){db=x;save();alert('Date restaurate.')}}catch(e){alert('Fișier backup invalid.')}};r.readAsText(file)}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
