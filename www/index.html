<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foaie de parcurs</title><style>body{font-family:system-ui;background:#f4f6f8;margin:0;color:#17202a}.w{max-width:620px;margin:auto;padding:18px}.b{width:100%;padding:20px;margin:8px 0;border:0;border-radius:16px;background:white;text-align:left;font-size:18px;font-weight:700}.b small{display:block;color:#667;font-weight:400}.m{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end}.s{background:white;width:100%;padding:18px;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;margin:4px 0 10px;box-sizing:border-box}.p,.q{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px}.p{background:#17202a;color:white}.q{background:#e9edf0}label{font-size:12px;color:#667}.v{text-align:center;color:#889;font-size:11px;margin-top:20px}</style></head><body><div class="w"><h1>Foaie de parcurs</h1><p id="a">Nicio deplasare activă</p><button class="b" onclick="start()">🚗 Înregistrează plecare<small>Preia ultima sosire • localitate și km editabile</small></button><button class="b" onclick="stop()">🏁 Înregistrează sosire<small>Localitate din listă • OCR odometru + corectare manuală</small></button><button class="b" onclick="fuel()">⛽ Alimentare<small>Introducere manuală / lipire • OCR doar odometru</small></button><button class="b" onclick="expense()">🔧 Cheltuială auto<small>Manual • fotografie/PDF opțional</small></button><button class="b" onclick="records()">📋 Înregistrări<small>Vezi datele salvate • editare • ștergere</small></button><button class="b" onclick="documents()">📄 Generare documente<small>Previzualizare și export lunar</small></button><button class="b" onclick="backup()">💾 Copie de siguranță<small>Salvează datele într-un fișier</small></button><button class="b" onclick="restore()">📥 Restaurare date<small>Importă o copie de siguranță</small></button><div class="v">V1.3.7 • TEST • liste Scop + Observații</div></div><input hidden id="cam" type="file" accept="image/*" capture="environment"><input hidden id="doc" type="file" accept="image/*,application/pdf"><input hidden id="restoreFile" type="file" accept=".json,application/json"><div id="h"></div><script>
const K='fp_v130';let d=JSON.parse(localStorage.getItem(K)||'null')||{trips:[],fuel:[],expenses:[],places:['Râșnov','Brașov','Pașcani'],lastKm:null,active:null};
d.purposes=d.purposes||['Deplasare la șantier','Activitate șantier','Activitate birou','Întoarcere'];
d.notesList=d.notesList||[];const $=x=>document.getElementById(x);function save(){localStorage.setItem(K,JSON.stringify(d));render()}function render(){$('a').textContent=d.active?'Deplasare activă • '+d.active.place+' • km '+d.active.km:'Nicio deplasare activă'}function ts(){return new Date().toLocaleString('ro-RO')}function dt(){return new Date().toLocaleDateString('ro-RO')}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pick(id,cb){let x=$(id);x.value='';x.onchange=()=>cb(x.files[0]);x.click()}async function du(f){return await new Promise(r=>{let q=new FileReader();q.onload=()=>r(q.result);q.readAsDataURL(f)})}async function ocr(f){let O=window.Capacitor?.Plugins?.CapacitorPluginMlKitTextRecognition;if(!O)throw Error('OCR indisponibil');let b=(await du(f)).replace(/^data:image\/[^;]+;base64,/,'');return (await O.detectText({base64Image:b,rotation:0})).text}function odo(t){let x=[...t.matchAll(/\b\d{4,7}\b/g)].map(v=>+v[0]);let q=d.lastKm==null?x:x.filter(v=>v>=d.lastKm&&v-d.lastKm<3000);return q.length?Math.min(...q):(x.length?Math.max(...x):'')}function closeModal(){h.innerHTML=''}function km(cb){window.kcb=cb;h.innerHTML='<div class="m"><div class="s"><h2>Kilometraj</h2><button class="p" onclick="kphoto()">📷 Fotografiază odometrul</button><button class="q" onclick="kmanual()">⌨️ Introdu manual</button><button class="q" onclick="closeModal()">Anulează</button></div></div>'}function kphoto(){pick('cam',async f=>{try{let v=odo(await ocr(f));one('Verifică kilometrajul','km','Kilometraj',v,x=>window.kcb(x.km))}catch(e){alert(e.message);kmanual()}})}function kmanual(){one('Kilometraj','km','Kilometraj','',x=>window.kcb(x.km))}function opts(v=''){return [...new Set([...d.places,v].filter(Boolean))].map(x=>'<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>').join('')}function loc(v=''){return '<label>Localitate</label><select name="place">'+opts(v)+'</select><button type="button" class="q" onclick="addloc()">+ Adaugă localitate</button>'}function addloc(){let x=prompt('Localitate nouă');if(!x)return;x=x.trim();if(!d.places.includes(x))d.places.push(x);save();let s=h.querySelector('select');if(s){s.innerHTML=opts(x);s.value=x}}function listopts(a,v=''){return [...new Set([...(a||[]),v].filter(Boolean))].map(x=>'<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>').join('')}
function purposeField(v=''){return '<label>Scopul deplasării</label><select name="purpose">'+listopts(d.purposes,v)+'</select><button type="button" class="q" onclick="addPurpose()">+ Adaugă scop nou</button>'}
function notesField(v=''){let empty='<option value="">— Fără observații —</option>';return '<label>Observații</label><select name="notes">'+empty+listopts(d.notesList,v)+'</select><button type="button" class="q" onclick="addNote()">+ Adaugă observație nouă</button>'}
function addPurpose(){let x=prompt('Scop nou:');if(!x)return;x=x.trim();if(!x)return;if(!d.purposes.includes(x))d.purposes.push(x);save();let q=h.querySelector('select[name=purpose]');if(q){q.innerHTML=listopts(d.purposes,x);q.value=x}}
function addNote(){let x=prompt('Observație nouă:');if(!x)return;x=x.trim();if(!x)return;if(!d.notesList.includes(x))d.notesList.push(x);save();let q=h.querySelector('select[name=notes]');if(q){q.innerHTML='<option value="">— Fără observații —</option>'+listopts(d.notesList,x);q.value=x}}
function tripform(title,kmv,cb){h.innerHTML='<div class="m"><div class="s"><h2>'+title+'</h2><form id="f">'+loc(d.active?.place||'')+purposeField(d.active?.purpose||'')+notesField(d.active?.notes||'')+'<button class="p">Salvează</button></form></div></div>';f.onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(f)),kmv)}}function start(){
 if(d.active)return alert('Există deja o deplasare activă');
 let last=d.trips.length?d.trips[d.trips.length-1]:null;
 let place=last?.arrivalPlace||d.active?.place||'';
 let kmv=last?.endKm??d.lastKm??'';
 departureForm({place,km:kmv});
}
function departureForm(v){
 h.innerHTML='<div class="m"><div class="s"><h2>Plecare</h2><form id="f"><label>Data / ora</label><input value="'+esc(ts())+'" disabled><label>Localitate plecare</label><select name="place">'+opts(v.place||'')+'</select><button type="button" class="q" onclick="addloc()">+ Adaugă localitate</button><label>Km plecare</label><input name="km" inputmode="numeric" value="'+esc(v.km??'')+'">${purposeField()}${notesField()}<button class="p">Înregistrează plecarea</button><button type="button" class="q" onclick="closeModal()">Anulează</button></form></div></div>';
 f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));let k=+x.km;if(!Number.isFinite(k))return alert('Kilometraj invalid');d.active={time:ts(),place:x.place,km:k,purpose:x.purpose,notes:x.notes};d.lastKm=k;save();closeModal()}
}function stop(){if(!d.active)return alert('Nu există plecare activă');km(k=>tripform('Sosire',k,(x,k)=>{d.trips.push({...d.active,arrivalTime:ts(),arrivalPlace:x.place,endKm:+k,purpose:x.purpose||d.active.purpose,notes:x.notes||d.active.notes});d.lastKm=+k;d.active=null;save();closeModal()}))}
function fuel(){km(k=>fuelForm({date:dt(),km:k}))}
function fuelForm(v={}){
 h.innerHTML=`<div class="m"><div class="s"><h2>Alimentare</h2>
 <label>Date bon – lipire rapidă</label>
 <textarea id="fuelPaste" rows="3" placeholder="ALIM|26.09.2026|Roman|002508|45.87|341.26"></textarea>
 <button class="q" type="button" id="fillFuel">Completează din text</button>
 <form id="fuelForm">
 <label>Data</label><input name="date" value="${esc(v.date||dt())}">
 ${loc(v.place||'')}
 <label>Nr. bon fiscal</label><input name="bon" value="${esc(v.bon||'')}">
 <label>Litri</label><input name="liters" inputmode="decimal" value="${esc(v.liters||'')}">
 <label>Valoare</label><input name="value" inputmode="decimal" value="${esc(v.value||'')}">
 <label>Kilometraj</label><input name="km" inputmode="numeric" value="${esc(v.km??'')}">
 <button type="button" class="q" id="fuelPhoto">📷 Poză bon (opțional)</button>
 <button class="p">Salvează</button>
 <button type="button" class="q" onclick="closeModal()">Anulează</button>
 </form></div></div>`;

 document.getElementById('fillFuel').onclick=()=>{
   const raw=(document.getElementById('fuelPaste').value||'').trim().replace(/\r?\n/g,'');
   let a=raw.split('|').map(x=>x.trim());
   if((a[0]||'').toUpperCase()==='ALIM')a.shift();
   if(a.length!==5){alert('Format: ALIM|data|localitate|nr.bon|litri|valoare');return}
   const [datev,place,bon,liters,value]=a;
   if(place&&!d.places.includes(place))d.places.push(place);
   const km=document.querySelector('#fuelForm [name=km]').value;
   fuelForm({date:datev||dt(),place,bon,liters,value,km});
 };
 document.getElementById('fuelPhoto').onclick=()=>pick('cam',x=>window.bon=x?.name||'');
 document.getElementById('fuelForm').onsubmit=e=>{
   e.preventDefault();
   const x=Object.fromEntries(new FormData(e.target));
   if(!x.date||!x.place||!x.bon||!x.liters||!x.value||!x.km){alert('Completează câmpurile obligatorii.');return}
   d.fuel.push({...x,time:ts(),fileName:window.bon||''});
   save();closeModal();
 };
}
function expense(){h.innerHTML='<div class="m"><div class="s"><h2>Cheltuială auto</h2><form id="f"><label>Data</label><input name="date" value="'+dt()+'"><label>Produs / cheltuială</label><input name="product"><label>Nr. factură / bon</label><input name="number"><label>Valoare</label><input name="value"><button type="button" class="q" onclick="pick(\'doc\',x=>window.edoc=x?.name)">📎 Fotografie / PDF (opțional)</button><button class="p">Salvează</button></form></div></div>';f.onsubmit=e=>{e.preventDefault();d.expenses.push({...Object.fromEntries(new FormData(f)),time:ts(),fileName:window.edoc||''});save();closeModal()}}function one(title,n,l,v,cb){h.innerHTML='<div class="m"><div class="s"><h2>'+title+'</h2><form id="f"><label>'+l+'</label><input name="'+n+'" value="'+esc(v)+'"><button class="p">Continuă</button></form></div></div>';f.onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(f)))}}function records(){
 let rows='';
 d.trips.map((x,i)=>({...x,_index:i})).sort((a,b)=>dateObj(a.time)-dateObj(b.time)).forEach(x=>{let i=x._index;rows+=`<div class="q"><b>🚗 ${esc(x.place||'—')} → ${esc(x.arrivalPlace||'—')}</b><br>${esc(x.km??'—')} → ${esc(x.endKm??'—')} km<br><button onclick="delrec('trip',${i})">Șterge</button></div>`});
 d.fuel.forEach((x,i)=>rows+=`<div class="q"><b>⛽ ${esc(x.place||'—')} • ${esc(x.liters||'—')} L</b><br>${esc(x.date||'')} • ${esc(x.value||'—')} lei • bon ${esc(x.bon||'—')}<br><button onclick="editFuel(${i})">Editează</button> <button onclick="delrec('fuel',${i})">Șterge</button></div>`);
 d.expenses.forEach((x,i)=>rows+=`<div class="q"><b>🔧 ${esc(x.product||'Cheltuială')}</b><br>${esc(x.date||'')} • ${esc(x.value||'—')} lei<br><button onclick="editExpense(${i})">Editează</button> <button onclick="delrec('expense',${i})">Șterge</button></div>`);
 h.innerHTML=`<div class="m"><div class="s"><h2>Înregistrări</h2>${rows||'<p>Nu există înregistrări.</p>'}<button class="q" onclick="closeModal()">Închide</button></div></div>`;
}
function delrec(t,i){if(!confirm('Ștergi această înregistrare?'))return;(t==='trip'?d.trips:t==='fuel'?d.fuel:d.expenses).splice(i,1);save();records()}
function editFuel(i){let x=d.fuel[i];fuelForm({...x});let ff=document.getElementById('fuelForm');if(ff)ff.onsubmit=e=>{e.preventDefault();d.fuel[i]={...x,...Object.fromEntries(new FormData(e.target))};save();records()}}
function editExpense(i){let x=d.expenses[i];h.innerHTML=`<div class="m"><div class="s"><h2>Editare cheltuială</h2><form id="ee"><label>Data</label><input name="date" value="${esc(x.date||'')}"><label>Produs</label><input name="product" value="${esc(x.product||'')}"><label>Nr. factură/bon</label><input name="number" value="${esc(x.number||'')}"><label>Valoare</label><input name="value" value="${esc(x.value||'')}"><button class="p">Salvează</button><button type="button" class="q" onclick="records()">Anulează</button></form></div></div>`;ee.onsubmit=e=>{e.preventDefault();d.expenses[i]={...x,...Object.fromEntries(new FormData(e.target))};save();records()}}


function dateObj(s){let iso=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]);let m=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})(?:[,\s]+(\d{1,2}):(\d{2}))?/);return m?new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)):new Date(0)}
function inputDate(s){let x=dateObj(s);if(!x.getTime())x=new Date();return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')+'T'+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')}
function roDate(s){let x=new Date(s);return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+x.getFullYear()+', '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')}
function editTrip(i){let x=d.trips[i];h.innerHTML=`<div class="m"><div class="s"><h2>Editare deplasare</h2><form id="editTripForm"><label>Data și ora plecării</label><input type="datetime-local" name="start" required value="${inputDate(x.time)}"><label>Localitate plecare</label><input name="place" required value="${esc(x.place)}"><label>Kilometraj plecare</label><input type="number" name="km" required value="${esc(x.km)}"><label>Data și ora sosirii</label><input type="datetime-local" name="end" required value="${inputDate(x.arrivalTime)}"><label>Localitate sosire</label><input name="arrivalPlace" required value="${esc(x.arrivalPlace)}"><label>Kilometraj sosire</label><input type="number" name="endKm" required value="${esc(x.endKm)}">${purposeField(x.purpose)}${notesField(x.notes)}<button class="p">Salvează</button><button type="button" class="q" onclick="records()">Anulează</button></form></div></div>`;document.getElementById('editTripForm').onsubmit=e=>{e.preventDefault();let a=Object.fromEntries(new FormData(e.target));if(+a.endKm<+a.km||new Date(a.end)<new Date(a.start))return alert('Verifică datele și kilometrajul.');d.trips[i]={...x,place:a.place,km:+a.km,time:roDate(a.start),arrivalPlace:a.arrivalPlace,endKm:+a.endKm,arrivalTime:roDate(a.end),purpose:a.purpose,notes:a.notes};for(let v of [a.place,a.arrivalPlace])if(!d.places.includes(v))d.places.push(v);save();records()}}
function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function backup(){download('foaie-parcurs-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'foaie-parcurs',version:1,data:d},null,2),'application/json')}
function restore(){if(!confirm('Restaurarea înlocuiește toate înregistrările actuale. Ai salvat o copie de siguranță?'))return;pick('restoreFile',async f=>{if(!f)return;try{let z=JSON.parse(await f.text());if(z.app!=='foaie-parcurs'||!z.data||!Array.isArray(z.data.trips)||!Array.isArray(z.data.fuel)||!Array.isArray(z.data.expenses))throw Error('Fișier invalid');d=z.data;d.places=d.places||[];d.purposes=d.purposes||[];d.notesList=d.notesList||[];save();alert('Date restaurate.')}catch(e){alert('Nu s-a putut restaura: '+e.message)}})}
function dateKey(s){let x=dateObj(s);return x.getTime()?x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'):''}
function monthRows(month){let trips=d.trips.filter(x=>dateKey(x.time).startsWith(month)).sort((a,b)=>dateObj(a.time)-dateObj(b.time));let result=[];let n=new Date(+month.slice(0,4),+month.slice(5),0).getDate();for(let day=1;day<=n;day++){let key=month+'-'+String(day).padStart(2,'0');let todays=trips.filter(x=>dateKey(x.time)===key);if(todays.length){for(let x of todays)result.push({date:key,type:'Deplasare',from:x.place,to:x.arrivalPlace,start:x.time,end:x.arrivalTime,km1:x.km,km2:x.endKm,dist:+x.endKm-+x.km,purpose:x.purpose||'',notes:x.notes||''})}else{let last=d.trips.filter(x=>dateKey(x.arrivalTime)<=key&&dateKey(x.arrivalTime)).sort((a,b)=>dateObj(b.arrivalTime)-dateObj(a.arrivalTime))[0];let next=d.trips.some(x=>dateKey(x.time)<key&&dateKey(x.arrivalTime)>=key);if(last&&!next)result.push({date:key,type:'Staționare',from:last.arrivalPlace,to:last.arrivalPlace,start:'',end:'',km1:last.endKm,km2:last.endKm,dist:0,purpose:'Staționare',notes:''})}}return result}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function csv(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')}
function documentData(month,kind){if(kind==='trips'){let rows=monthRows(month);return [['Data','Alimentare (litri)','Plecare','Ora plecare','Sosire','Ora sosire','Km plecare','Km sosire','Km parcurși','Scop','Observații'],...rows.map(x=>[x.date,(rows.find(y=>y.date===x.date)===x?d.fuel.filter(f=>dateKey(f.date)===x.date).map(f=>f.liters).join(' + '):''),x.from,x.start,x.to,x.end,x.km1,x.km2,x.dist,x.purpose,x.notes])]}return [['Data','Document','Produs','Kilometraj','Combustibil (litri)','Valoare (lei)','Tip'],...d.fuel.filter(x=>dateKey(x.date).startsWith(month)).map(x=>[x.date,x.bon,'Benzină',x.km,x.liters,x.value,'Alimentare']),...d.expenses.filter(x=>dateKey(x.date).startsWith(month)).map(x=>[x.date,x.number,x.product,'','',x.value,'Cheltuială'])].sort((a,b)=>a[0]==='Data'?-1:b[0]==='Data'?1:dateObj(a[0])-dateObj(b[0]))}
function documents(){let month=new Date().toISOString().slice(0,7);h.innerHTML=`<div class="m"><div class="s"><h2>Generare documente</h2><label>Luna</label><input type="month" id="docMonth" value="${month}"><label>Document</label><select id="docKind"><option value="trips">Foaie de parcurs</option><option value="expenses">Fișă de cheltuieli auto</option></select><button class="p" onclick="previewDoc()">Previzualizare</button><button class="q" onclick="exportDoc()">Export CSV (Excel)</button><button class="q" onclick="closeModal()">Închide</button><div id="docPreview" style="overflow-x:auto;font-size:12px"></div></div></div>`;previewDoc()}
function previewDoc(){let rows=documentData($('docMonth').value,$('docKind').value);$('docPreview').innerHTML='<table border="1" cellpadding="5" style="border-collapse:collapse">'+rows.map((r,i)=>'<tr>'+r.map(c=>'<'+(i?'td':'th')+'>'+esc(c)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table>'}
function exportDoc(){let month=$('docMonth').value,kind=$('docKind').value;download((kind==='trips'?'Foaie-parcurs-':'Fisa-cheltuieli-')+month+'.csv',csv(documentData(month,kind)),'text/csv;charset=utf-8')}

render();
</script></body></html>
